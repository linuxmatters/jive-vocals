name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Weekly
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-code:
    name: Lint Code 🧹
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check cyclomatic complexity
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          gocyclo -top 20 -ignore '_test\.go$' -avg .
      - name: Check ineffectual assignments
        run: |
          go install github.com/gordonklaus/ineffassign@v0.2.0
          ineffassign ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-actions:
    name: Lint Action ⚙️
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: freerangebytes/setup-actionlint@v0.1.2
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  coverage:
    name: Coverage 📊
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - uses: robherley/go-test-action@v1
        env:
          CGO_ENABLED: 1
        with:
          testArguments: -coverprofile=coverage.out -covermode=atomic ./...
          omit: untested

  test:
    name: Test 🧪
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

  security:
    name: Security 🔒
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          license-check: false
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.38.2
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  sentinel:
    name: Sentinel 👁️
    needs: [lint-code, lint-actions, coverage, test, security]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: ${results}"
          if echo "${results}" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null 2>&1; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: [sentinel]
    if: always() && needs.sentinel.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building jive-vocals $VERSION for ${{ matrix.os }}/${{ matrix.arch }}"
      - name: Build binary
        env:
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-X main.version=${{ steps.version.outputs.version }}" -o jive-vocals-${{ matrix.os }}-${{ matrix.arch }} ./cmd/jive-vocals
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jive-vocals-${{ matrix.os }}-${{ matrix.arch }}
          path: jive-vocals-${{ matrix.os }}-${{ matrix.arch }}

  release:
    name: Release 📦
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > CHANGELOG.md
            git log "$PREV_TAG"..HEAD --pretty=format:"* %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
            git log --pretty=format:"* %s (%h)" >> CHANGELOG.md
          fi

          cat >> CHANGELOG.md << 'NOTES'

          ## Installation

          Download the appropriate binary for your platform below, make it executable, and move it to `~/.local/bin` (on PATH for most shells, no root required):

          ```bash
          # Linux (amd64)
          chmod +x jive-vocals-linux-amd64
          mkdir -p ~/.local/bin && mv jive-vocals-linux-amd64 ~/.local/bin/jive-vocals

          # macOS (Apple Silicon)
          chmod +x jive-vocals-darwin-arm64
          mkdir -p ~/.local/bin && mv jive-vocals-darwin-arm64 ~/.local/bin/jive-vocals
          ```

          ## Checksums

          SHA256 checksums are provided below for verification.
          NOTES

          cat CHANGELOG.md
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: jive-vocals-*
          merge-multiple: false
      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Jive Vocals ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: artifacts/jive-vocals-*/jive-vocals-*
