name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Weekly
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-code:
    name: Lint Code 🧹
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check cyclomatic complexity
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          gocyclo -top 20 -ignore '_test\.go$' -avg .
      - name: Check ineffectual assignments
        run: |
          go install github.com/gordonklaus/ineffassign@v0.2.0
          ineffassign ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-actions:
    name: Lint Action ⚙️
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: freerangebytes/setup-actionlint@v0.1.2
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  coverage:
    name: Coverage 📊
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - uses: robherley/go-test-action@v1
        env:
          CGO_ENABLED: 1
        with:
          testArguments: -coverprofile=coverage.out -covermode=atomic ./...
          omit: untested

  test:
    name: Test 🧪
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

  security:
    name: Security 🔒
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          license-check: false
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.39.2
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  sentinel:
    name: Sentinel 👁️
    needs: [lint-code, lint-actions, coverage, test, security]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: ${results}"
          if echo "${results}" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null 2>&1; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: [sentinel]
    if: always() && needs.sentinel.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get ffmpeg-statigo submodule SHA
        id: ffmpeg-statigo
        run: echo "sha=$(git -C third_party/ffmpeg-statigo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg-statigo libraries
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-statigo/lib
          key: ffmpeg-statigo-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ffmpeg-statigo.outputs.sha }}
      - name: Download ffmpeg-statigo libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd third_party/ffmpeg-statigo
          go run ./cmd/download-lib
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.0"
          args: release --clean ${{ startsWith(github.ref, 'refs/tags/') && '--skip=publish,announce' || '--snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.os }}_${{ matrix.arch }}
      - name: Collect release files
        run: |
          mkdir -p artifacts
          jq -r '.[] | select(.extra.Checksum) | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r path name; do
              cp "${path}" "artifacts/${name}"
            done
          ls -l artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jive-vocals-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Release 📦
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: jive-vocals-*
          merge-multiple: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.0"
          args: release --clean --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git tag --force latest "${RELEASE_TAG}^{commit}"
          git push --force origin refs/tags/latest
