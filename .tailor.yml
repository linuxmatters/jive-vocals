# Initially fitted by tailor on 2026-03-13
license: GPL-3.0

languages:
  go:
    enabled: true
    cgo: true
    ffmpeg-statigo: true

repository:
  description: Raw microphone recordings into broadcast-ready audio in one command. No configuration, and no surprises 🗣️
  homepage: https://linuxmatters.sh/jive/vocals/
  has_wiki: false
  has_discussions: false
  has_projects: false
  has_issues: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  delete_branch_on_merge: true
  allow_update_branch: false
  allow_auto_merge: false
  web_commit_signoff_required: false
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
  topics:
    - audio
    - broadcast
    - compressor
    - lufs
    - noise-reduction
    - noise-removal
    - normalization
    - peak-detection
    - podcast
    - pre-processor
    - youtube

pages:
  links:
    website: https://linuxmatters.sh/jive/vocals/
    bluesky: https://bsky.app/profile/wimpys.world
    mastodon: "https://wimpysworld.social/@martin"
    linkedin: https://linkedin.com/in/martinwimpress
    discord: https://discord.com/invite/vUsydfP
    telegram: https://t.me/joinchat/Plfd07auVLayNLBD
    podcast: https://linuxmatters.sh
    github_sponsors: https://github.com/sponsors/flexiondotorg

social:
  enabled: true
  theme: dark
  accent: "#feb81e"
  og:
    output: pages/og.png
    include_preview: true
    image: pages/demo-still.png
  readme:
    header: true
    preferred_links:
      - bluesky
      - mastodon
      - linkedin
    community: telegram
    packages:
      - apt
      - rpm
      - pkg
      - brew
      - nix
    stats: true
    star_history:
      enabled: true
      min_stars: 25
      min_days: 30
    sponsors: auto
    contributors: true
    demo: true
    footer: true
  live:
    branch: social-assets
    schedule: "0 4 * * *"

labels:
  - name: bug
    color: d20f39
    description: "Something isn't working"

  - name: documentation
    color: 04a5e5
    description: Documentation improvement

  - name: duplicate
    color: 8839ef
    description: Already exists

  - name: enhancement
    color: 1e66f5
    description: New feature request

  - name: good first issue
    color: 40a02b
    description: Good for newcomers

  - name: help wanted
    color: 179299
    description: Extra attention needed

  - name: invalid
    color: e64553
    description: Not valid or relevant

  - name: question
    color: 7287fd
    description: Needs more information

  - name: wontfix
    color: dc8a78
    description: Will not be worked on

  - name: dependencies
    color: fe640b
    description: Dependency update

  - name: github_actions
    color: ea76cb
    description: GitHub Actions update

  - name: hacktoberfest-accepted
    color: df8e1d
    description: Hacktoberfest contribution

swatches:
  - path: .github/dependabot.yml
    alteration: first-fit

  - path: .github/FUNDING.yml
    alteration: first-fit

  - path: .github/ISSUE_TEMPLATE/bug_report.yml
    alteration: always

  - path: .github/ISSUE_TEMPLATE/feature_request.yml
    alteration: always

  - path: .github/ISSUE_TEMPLATE/config.yml
    alteration: first-fit

  - path: SECURITY.md
    alteration: always

  - path: CODE_OF_CONDUCT.md
    alteration: always

  - path: CONTRIBUTING.md
    alteration: always

  - path: SUPPORT.md
    alteration: always

  - path: justfile
    alteration: first-fit

  - path: flake.nix
    alteration: first-fit

  - path: .gitignore
    alteration: first-fit

  - path: .envrc
    alteration: first-fit

  - path: cubic.yaml
    alteration: first-fit

  - path: .tailor.yml
    alteration: first-fit
